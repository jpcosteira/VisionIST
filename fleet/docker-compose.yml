# Generated by tools/make_fleet.py - edit the command, not this file.
#
#   boxes:    clip, features, lang_sam, lightglue, moge, opencv, sbert, tapnext, unimatch, vggt, yolo
#   registry: ghcr
#
# Each service pulls a prebuilt image. Every box listens on 8061 inside
# its container (AI4EU spec); the host ports below are assigned in name
# order from --base-port. On the fleet network a box is reachable by its
# service name on 8061, which is what fleet.json uses.

name: visionist-fleet

services:
  # CLIP image and text embeddings with their cross-modal similarity
  clip:
    image: ghcr.io/sipg-isr/visionist-clip:0.1.0
    container_name: visionist-clip
    ports: ["9061:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # SIFT keypoints in the SIFT-Extractor layout: (2+128) x N, annotated JPEGs, MATLAB .mat
  features:
    image: ghcr.io/sipg-isr/visionist-features:0.1.0
    container_name: visionist-features
    ports: ["9062:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped

  # Text-guided segmentation with LangSAM: phrases in, masks out
  lang_sam:
    image: ghcr.io/sipg-isr/visionist-lang-sam:0.1.0
    container_name: visionist-lang_sam
    ports: ["9063:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # SuperPoint/DISK features and LightGlue matching, pairwise or as a sliding-window stream
  lightglue:
    image: ghcr.io/sipg-isr/visionist-lightglue:0.1.0
    container_name: visionist-lightglue
    ports: ["9064:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # MoGe-3 monocular geometry: metric depth, point map, normals, intrinsics
  moge:
    image: ghcr.io/sipg-isr/visionist-moge:0.1.0
    container_name: visionist-moge
    ports: ["9065:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Classic feature extraction and matching: SIFT/ORB via FLANN, or SuperPoint/DISK via LightGlue, plus a RANSAC fundamental matrix
  opencv:
    image: ghcr.io/sipg-isr/visionist-opencv:0.1.0
    container_name: visionist-opencv
    ports: ["9066:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Sentence-BERT text embeddings and their pairwise similarity
  sbert:
    image: ghcr.io/sipg-isr/visionist-sbert:0.1.0
    container_name: visionist-sbert
    ports: ["9067:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # TAPNext point tracking with the Tomasi-Kanade observation matrix
  tapnext:
    image: ghcr.io/sipg-isr/visionist-tapnext:0.1.0
    container_name: visionist-tapnext
    ports: ["9068:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Unified dense matching: optical flow, stereo disparity, and multi-view depth
  unimatch:
    image: ghcr.io/sipg-isr/visionist-unimatch:0.1.0
    container_name: visionist-unimatch
    ports: ["9069:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # VGGT multi-view 3D reconstruction: world points, per-view depth, camera poses, and a GLB  (~8 GB)
  vggt:
    image: ghcr.io/sipg-isr/visionist-vggt:0.1.0
    container_name: visionist-vggt
    ports: ["9070:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # YOLO object detection with always-on tracking, on images or video
  yolo:
    image: ghcr.io/sipg-isr/visionist-yolo:0.1.0
    container_name: visionist-yolo
    ports: ["9071:8061"]
    environment: [ PORT=8061 ]
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The browser front end. It reaches boxes by SERVICE NAME on 8061,
  # which is what data/fleet.json below records.
  webui:
    image: ghcr.io/sipg-isr/visionist-webui:latest
    container_name: visionist-webui
    ports: ["8080:8000"]
    environment:
      - WEBUI_HOST=0.0.0.0
      - WEBUI_PORT=8000
      - WEBUI_DATA_DIR=/data
    volumes:
      - ./data:/data
    depends_on:
      - clip
      - features
      - lang_sam
      - lightglue
      - moge
      - opencv
      - sbert
      - tapnext
      - unimatch
      - vggt
      - yolo
    restart: unless-stopped
