<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>How VisionIST works — a box-agnostic client calling independent gRPC inference boxes</title>
<defs>
  <marker id="arrO" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L12 6 L0 12 z" fill="#E07B39"/>
  </marker>
  <marker id="arrG" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
    <path d="M0 0 L12 6 L0 12 z" fill="#2E8B7A"/>
  </marker>
  <style>
    .h1 { font-size:34px; font-weight:700; fill:#11334F; }
    .sub { font-size:17px; fill:#4A6B82; }
    .ph  { font-size:14px; font-weight:700; fill:#FFFFFF; letter-spacing:1.1px; }
    .pm  { font-size:12.5px; fill:#D8ECFA; }
    .ct  { font-size:15px; font-weight:700; fill:#11334F; }
    .cb  { font-size:13.5px; fill:#4A6B82; }
    .mono{ font-size:13px; font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,monospace; fill:#1D4B6B; }
    .lbl { font-size:13px; font-weight:700; fill:#11334F; }
    .lbl2{ font-size:12.5px; fill:#5B7B91; }
    .note{ font-size:13.5px; fill:#4A6B82; }
    .badge{ font-size:14px; font-weight:700; fill:#FFFFFF; }
    .tiny{ font-size:11.5px; fill:#5B7B91; }
  </style>
</defs>

<rect width="1600" height="1130" fill="#F5F9FC"/>

<!-- ───────── title ───────── -->
<text class="h1" x="48" y="64">How VisionIST works</text>
<text class="sub" x="48" y="98">One gRPC envelope. Independent Dockerized inference boxes. A client that knows none of them.</text>
<text x="1552" y="64" text-anchor="end" font-size="26" font-weight="700" fill="#459BDA">VisionIST</text>
<text class="tiny" x="1552" y="88" text-anchor="end">ISR · Signal and Image Processing Group</text>

<!-- ═════════ CLIENT PANEL ═════════ -->
<rect x="48" y="150" width="430" height="660" rx="16" fill="#FFFFFF" stroke="#D4E4F1" stroke-width="1.5"/>
<path d="M48 166 a16 16 0 0 1 16 -16 h398 a16 16 0 0 1 16 16 v28 h-430 z" fill="#459BDA"/>
<text class="ph" x="70" y="180">CLIENT MACHINE — YOUR LAPTOP</text>

<!-- laptop glyph -->
<rect x="193" y="212" width="140" height="94" rx="6" fill="#FFFFFF" stroke="#2C5C7F" stroke-width="3"/>
<rect x="201" y="220" width="124" height="78" rx="3" fill="#EAF4FC"/>
<rect x="211" y="231" width="36" height="28" rx="2" fill="none" stroke="#E07B39" stroke-width="2.2"/>
<rect x="257" y="248" width="46" height="34" rx="2" fill="none" stroke="#2E8B7A" stroke-width="2.2"/>
<path d="M181 306 h164 l20 18 h-204 z" fill="#CFE3F2" stroke="#2C5C7F" stroke-width="2.4" stroke-linejoin="round"/>

<!-- card 1 -->
<rect x="70" y="352" width="386" height="66" rx="9" fill="#F7FBFE" stroke="#DCEAF5"/>
<text class="ct" x="88" y="377">Your code</text>
<text class="cb" x="88" y="400">notebook · Python script · MATLAB (vs*.m) · webui at :8080</text>

<!-- card 2 -->
<rect x="70" y="430" width="386" height="92" rx="9" fill="#F7FBFE" stroke="#DCEAF5"/>
<text class="ct" x="88" y="455">visionist_client</text>
<text class="mono" xml:space="preserve" x="88" y="481">b = Visionist("10.0.0.5:9061")</text>
<text class="mono" xml:space="preserve" x="88" y="503">res = b.run(data=..., config=...)</text>
<circle cx="70" cy="455" r="14" fill="#E07B39"/>
<text class="badge" x="70" y="455" text-anchor="middle" dy="0.35em">1</text>

<!-- card 3 -->
<rect x="70" y="534" width="386" height="122" rx="9" fill="#F7FBFE" stroke="#DCEAF5"/>
<text class="ct" x="88" y="559">What the client does</text>
<text class="cb" x="88" y="584">• wraps your values into one Envelope</text>
<text class="cb" x="88" y="607">• namespaces config under the box key</text>
<text class="cb" x="88" y="630">• decodes the reply with the codec the box declared</text>
<circle cx="70" cy="559" r="14" fill="#E07B39"/>
<text class="badge" x="70" y="559" text-anchor="middle" dy="0.35em">5</text>

<!-- card 4 -->
<rect x="70" y="668" width="386" height="66" rx="9" fill="#F7FBFE" stroke="#DCEAF5"/>
<text class="ct" x="88" y="693">Orchestration lives here</text>
<text class="cb" x="88" y="716">calling several boxes in sequence is the caller's job</text>

<text class="note" x="263" y="772" text-anchor="middle" fill="#2C5C7F">the client knows no box, no model, no field names</text>

<!-- ═════════ NETWORK LANE ═════════ -->
<!-- request to A -->
<path d="M478 290 C 620 290, 790 254, 978 254" fill="none" stroke="#E07B39" stroke-width="3" marker-end="url(#arrO)"/>
<text class="lbl"  x="722" y="232" text-anchor="middle" fill="#B55F22">gRPC   Process( Envelope )</text>
<text class="lbl2" x="722" y="252" text-anchor="middle">images + config_json</text>
<circle cx="556" cy="285" r="14" fill="#E07B39"/>
<text class="badge" x="556" y="285" text-anchor="middle" dy="0.35em">2</text>

<!-- response from A -->
<path d="M978 320 C 790 320, 620 356, 482 356" fill="none" stroke="#2E8B7A" stroke-width="3" marker-end="url(#arrG)"/>
<text class="lbl"  x="722" y="382" text-anchor="middle" fill="#1F6B5D">Envelope back</text>
<text class="lbl2" x="722" y="402" text-anchor="middle">data + the encoding the box declares</text>
<circle cx="556" cy="352" r="14" fill="#2E8B7A"/>
<text class="badge" x="556" y="352" text-anchor="middle" dy="0.35em">4</text>

<!-- middle note -->
<rect x="528" y="438" width="412" height="118" rx="10" fill="#EAF3FA"/>
<rect x="528" y="438" width="5" height="118" rx="2.5" fill="#459BDA"/>
<text class="ct"   x="554" y="468">No registry. No broker.</text>
<text class="cb"   x="554" y="493">The client dials each box directly by IP:port, so a</text>
<text class="cb"   x="554" y="514">local box and a remote one are the same call — and</text>
<text class="cb"   x="554" y="535">any box can be restarted or moved on its own.</text>

<!-- request to B -->
<path d="M478 600 C 640 600, 800 608, 978 608" fill="none" stroke="#E07B39" stroke-width="3" marker-end="url(#arrO)"/>
<text class="lbl"  x="722" y="578" text-anchor="middle" fill="#B55F22">gRPC   Process( Envelope )</text>
<text class="lbl2" x="722" y="598" text-anchor="middle">images + text_prompt</text>

<!-- response from B -->
<path d="M978 672 C 800 672, 640 680, 482 680" fill="none" stroke="#2E8B7A" stroke-width="3" marker-end="url(#arrG)"/>
<text class="lbl"  x="722" y="702" text-anchor="middle" fill="#1F6B5D">Envelope back</text>
<text class="lbl2" x="722" y="722" text-anchor="middle">same contract, different model</text>

<!-- ═════════ SERVER A ═════════ -->
<rect x="990" y="150" width="562" height="310" rx="16" fill="#FFFFFF" stroke="#D4E4F1" stroke-width="1.5"/>
<path d="M990 166 a16 16 0 0 1 16 -16 h530 a16 16 0 0 1 16 16 v28 h-562 z" fill="#2C5C7F"/>
<text class="ph" x="1012" y="180">SERVER A — GPU MACHINE · 10.0.0.5</text>
<text class="pm" x="1530" y="180" text-anchor="end">host :9061 → container :8061</text>

<rect x="1012" y="212" width="404" height="178" rx="10" fill="#F3F8FC" stroke="#9FC4DE" stroke-width="1.6" stroke-dasharray="7 5"/>
<text class="ct" x="1032" y="240">Docker image · sipgisr/yolo</text>
<text class="cb" x="1032" y="268">• pipeline.proto — the shared envelope</text>
<text class="cb" x="1032" y="291">• yolo_service.py — the gRPC servicer</text>
<text class="cb" x="1032" y="314">• YOLOv8n weights (ultralytics)</text>
<text class="cb" x="1032" y="337">• per-session tracker state → track_id</text>
<text class="mono" xml:space="preserve" x="1032" y="368">PipelineService.Process   ·   key "yolo"</text>
<circle cx="1012" cy="240" r="14" fill="#2C5C7F"/>
<text class="badge" x="1012" y="240" text-anchor="middle" dy="0.35em">3</text>

<!-- GPU chip glyph -->
<rect x="1446" y="228" width="76" height="60" rx="6" fill="#FFFFFF" stroke="#2C5C7F" stroke-width="2.4"/>
<rect x="1460" y="242" width="48" height="32" rx="3" fill="#CFE3F2"/>
<g stroke="#2C5C7F" stroke-width="2.2" stroke-linecap="round">
  <path d="M1462 228 v-10 M1484 228 v-10 M1506 228 v-10"/>
  <path d="M1462 288 v10 M1484 288 v10 M1506 288 v10"/>
  <path d="M1446 244 h-10 M1446 266 h-10"/>
  <path d="M1522 244 h10 M1522 266 h10"/>
</g>
<text class="tiny" x="1484" y="322" text-anchor="middle">CPU at startup</text>
<text class="tiny" x="1484" y="338" text-anchor="middle">→ GPU on 1st request</text>
<text class="tiny" x="1484" y="354" text-anchor="middle">→ CPU after ~60 s idle</text>

<text class="cb" x="1012" y="424" fill="#2C5C7F">returns <tspan font-weight="700">detections</tspan> (json) + <tspan font-weight="700">annotated</tspan> image (identity)</text>

<!-- ═════════ SERVER B ═════════ -->
<rect x="990" y="500" width="562" height="310" rx="16" fill="#FFFFFF" stroke="#D4E4F1" stroke-width="1.5"/>
<path d="M990 516 a16 16 0 0 1 16 -16 h530 a16 16 0 0 1 16 16 v28 h-562 z" fill="#2C5C7F"/>
<text class="ph" x="1012" y="530">SERVER B — GPU MACHINE · 10.0.0.7</text>
<text class="pm" x="1530" y="530" text-anchor="end">host :9062 → container :8061</text>

<rect x="1012" y="562" width="404" height="178" rx="10" fill="#F3F8FC" stroke="#9FC4DE" stroke-width="1.6" stroke-dasharray="7 5"/>
<text class="ct" x="1032" y="590">Docker image · sipgisr/lang_segm</text>
<text class="cb" x="1032" y="618">• pipeline.proto — the very same envelope</text>
<text class="cb" x="1032" y="641">• lang_segm_service.py — the gRPC servicer</text>
<text class="cb" x="1032" y="664">• LangSAM — GroundingDINO + SAM 2</text>
<text class="cb" x="1032" y="687">• stateless · text_prompt rides in config</text>
<text class="mono" xml:space="preserve" x="1032" y="718">PipelineService.Process   ·   key "lang_sam"</text>

<rect x="1446" y="578" width="76" height="60" rx="6" fill="#FFFFFF" stroke="#2C5C7F" stroke-width="2.4"/>
<rect x="1460" y="592" width="48" height="32" rx="3" fill="#CFE3F2"/>
<g stroke="#2C5C7F" stroke-width="2.2" stroke-linecap="round">
  <path d="M1462 578 v-10 M1484 578 v-10 M1506 578 v-10"/>
  <path d="M1462 638 v10 M1484 638 v10 M1506 638 v10"/>
  <path d="M1446 594 h-10 M1446 616 h-10"/>
  <path d="M1522 594 h10 M1522 616 h10"/>
</g>
<text class="tiny" x="1484" y="672" text-anchor="middle">same GPU lifecycle:</text>
<text class="tiny" x="1484" y="688" text-anchor="middle">loaded lazily, parked</text>
<text class="tiny" x="1484" y="704" text-anchor="middle">on CPU when idle</text>

<text class="cb" x="1012" y="774" fill="#2C5C7F">returns <tspan font-weight="700">masks</tspan> + <tspan font-weight="700">boxes</tspan> — zstd_pickle, as that box declares</text>

<!-- ═════════ ENVELOPE PANEL ═════════ -->
<rect x="48" y="840" width="1504" height="250" rx="16" fill="#FFFFFF" stroke="#D4E4F1" stroke-width="1.5"/>
<path d="M48 856 a16 16 0 0 1 16 -16 h1472 a16 16 0 0 1 16 16 v28 h-1504 z" fill="#459BDA"/>
<text class="ph" x="70" y="870">THE ENVELOPE — ONE MESSAGE TYPE FOR EVERY BOX</text>
<text class="pm" x="1530" y="870" text-anchor="end">service PipelineService { rpc Process(Envelope) returns (Envelope); }</text>

<rect x="72" y="900" width="712" height="146" rx="10" fill="#FFF7F1" stroke="#F0D5BF"/>
<text class="ct" x="92" y="926" fill="#B55F22">Request — client → box</text>
<text class="mono" xml:space="preserve" x="92" y="952">config_json  {"yolo": {"command": "track",</text>
<text class="mono" xml:space="preserve" x="92" y="974">                       "parameters": {"conf": 0.35},</text>
<text class="mono" xml:space="preserve" x="92" y="996">                       "session_id": "cam-1"}}</text>
<text class="mono" xml:space="preserve" x="92" y="1024">data         {"images": [ jpeg bytes, ... ]}</text>

<rect x="816" y="900" width="712" height="146" rx="10" fill="#F2FAF7" stroke="#C3E3D9"/>
<text class="ct" x="836" y="926" fill="#1F6B5D">Response — box → client</text>
<text class="mono" xml:space="preserve" x="836" y="952">config_json  {"yolo": {"status": "ok", "n": 7},</text>
<text class="mono" xml:space="preserve" x="836" y="974">              "encoding": {"detections": "json",</text>
<text class="mono" xml:space="preserve" x="836" y="996">                           "annotated": "identity"}}</text>
<text class="mono" xml:space="preserve" x="836" y="1024">data         {"detections": ..., "annotated": png bytes}</text>

<text class="note" xml:space="preserve" x="800" y="1072" text-anchor="middle">The box declares how its payload should be read — identity · json · numpy · torch · zstd_pickle — and the client decodes with it.</text>
</svg>
