name: publish webui

# The webui is the only image this repo publishes; boxes live in VisionIST_Library.
on:
  push:
    tags: ["webui-v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: v
        run: |
          V="${GITHUB_REF_NAME#webui-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || V="dev"
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: webui/Dockerfile
          push: true
          tags: |
            sipgisr/visionist-webui:${{ steps.v.outputs.version }}
            sipgisr/visionist-webui:latest
